<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="10" />
    <title>食堂メニュー</title>
    <style>
      body { font-family: sans-serif; margin: 24px; }
      h1 { margin: 0 0 12px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
      th { background: #f3f3f3; }
      .empty { color: #666; }
    </style>
  </head>

  <body>
    <h1>食堂メニュー</h1>

    {% if menu_row and menu_row|length > 0 %}
      <table>
        <thead>
          <tr>
            <th>提供日</th>
            <th>メニュー</th>
          </tr>
        </thead>
        <tbody>
          {% for m in menu_row %}
            <tr>
              <td>{{ m.date }}</td>
              <td>{{ m.name }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p class="empty">メニューがありません。</p>
    {% endif %}
  </body>
</html>
